<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Missão Português Year 5</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: uma coluna de celular (max 560px). Mapa de lições em trilha; lição = barra de progresso no topo, cartão no meio, botão grande embaixo. Cores = as três cores do roteiro da escola (azul plurais, verde artigos, amarelo gênero). Tema claro fixo de propósito (jogo infantil). */
:root{
  --bg:#EEF3FB; --card:#FFFFFF; --ink:#1D2340; --muted:#5D6487; --line:#D6DDEC;
  --blue:#2D5BD0; --blue-d:#1F44A6; --blue-l:#E3EBFD;
  --green:#14755B; --green-d:#0C5643; --green-l:#DDF2EA;
  --amber:#E7A21B; --amber-d:#B97C06; --amber-l:#FFF2D3;
  --ok:#2FA968; --ok-d:#1F8450; --ok-l:#DDF6E7;
  --oops:#E8723C; --oops-d:#BD5323; --oops-l:#FFE8DC;
  --gold:#F5B800; --rust:#C4572A; --tico:#B9773F; --tico-d:#7E4B22; --cream:#F7E8C9;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.btn{display:block;width:100%;padding:14px 18px;border-radius:16px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.02em;text-transform:uppercase;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-d);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue-d)}
.btn[disabled]{background:var(--line);color:#9AA2BE;box-shadow:0 5px 0 #C3CBDD;cursor:default}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)}
.btn.oops{background:var(--oops);box-shadow:0 5px 0 var(--oops-d)}
.btn.ghost{background:var(--card);color:var(--blue);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.small{font-size:16px;padding:10px 14px}

/* ---------- mascote ---------- */
.tico{display:block}
.bounce{animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}

/* ---------- início ---------- */
.start{display:grid;gap:18px;padding-top:24px;text-align:center;justify-items:center}
.start h1{font-size:40px;color:var(--blue-d)}
.start h1 span{display:block;font-size:22px;color:var(--muted);font-weight:700}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-weight:700;max-width:420px}
.bubble::after{content:"";position:absolute;left:50%;top:-11px;width:18px;height:18px;background:var(--card);border-left:2px solid var(--line);border-top:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.name-in{width:100%;max-width:340px;font:800 24px var(--f-display);text-align:center;padding:12px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink)}
.start .btn{max-width:340px}
.chips3{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{font-weight:800;font-size:14px;padding:5px 12px;border-radius:999px;color:#fff}

/* ---------- mapa ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px 14px}
.hello{font:800 26px var(--f-display)}
.pills{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:900;font-variant-numeric:tabular-nums}
.pill svg{width:20px;height:20px}
.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.cta-row .btn{font-size:15px;padding:12px 8px}
.mod{margin-bottom:26px}
.mod-head{border-radius:20px;padding:14px 16px;color:#fff;display:flex;align-items:center;gap:12px}
.mod-head .num{font:800 34px var(--f-display);opacity:.9;line-height:1}
.mod-head h2{font-size:26px}
.mod-head p{margin:0;font-weight:700;opacity:.92;font-size:15px}
.trail{display:grid;gap:14px;padding:18px 0 0}
.node{display:flex;align-items:center;gap:14px;width:fit-content;max-width:100%}
.node:nth-child(4n+2){margin-left:18%}
.node:nth-child(4n+3){margin-left:34%}
.node:nth-child(4n+4){margin-left:18%}
.dot{flex:none;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font:800 28px var(--f-display);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);position:relative}
.dot.done{box-shadow:0 6px 0 rgba(0,0,0,.18),0 0 0 5px var(--gold) inset}
.node-label{min-width:0}
.node-label b{display:block;font-size:16px;line-height:1.2}
.stars{display:flex;gap:2px;margin-top:3px}
.stars svg{width:18px;height:18px}
.final .dot{width:84px;height:84px;background:var(--gold);box-shadow:0 6px 0 #C08F00}
.settings{margin-top:30px;background:var(--card);border-radius:18px;border:2px solid var(--line);padding:14px 16px;display:grid;gap:10px}
.settings h3{font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.toggle{width:56px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-pressed="true"]{background:var(--ok)}
.toggle[aria-pressed="true"]::after{left:28px}
.linkbtn{color:var(--blue);font-weight:800;text-decoration:underline;padding:4px 0}
.linkbtn.danger{color:var(--oops-d)}

/* ---------- lição ---------- */
.lesson{display:flex;flex-direction:column;gap:16px}
.lbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5}
.x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--muted)}
.x svg{width:24px;height:24px}
.prog{flex:1;height:18px;background:var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:var(--ok);transition:width .4s ease;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
.combo{font-weight:900;color:var(--oops-d);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.card{background:var(--card);border-radius:22px;border:2px solid var(--line);padding:18px}
.kicker{font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#fff;display:inline-block;padding:4px 10px;border-radius:999px;margin-bottom:10px}
.ex-title{font-size:28px;margin-bottom:12px}
.formula{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;font:800 22px var(--f-display);background:var(--bg);border-radius:16px;padding:12px;margin:6px 0 14px}
.formula .fx{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:2px 10px;white-space:nowrap}
.formula .s{color:var(--blue);border-color:var(--blue)}
.formula .op{color:var(--muted)}
.ex-body p{margin:0 0 10px}
.ex-list{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.ex-list li{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px;background:var(--bg);border-radius:12px;padding:8px 12px;font-weight:800;font-size:19px}
.ex-list .arrow{color:var(--muted)}
.ex-list small{flex-basis:100%;font-weight:600;font-size:14px;color:var(--muted)}
mark{background:none;color:var(--blue);font-weight:900;text-decoration:underline 3px;text-underline-offset:3px}
.m-artigos mark{color:var(--green)}
.m-genero mark{color:var(--amber-d)}
.tip{display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.tip .bubble{flex:1;text-align:left;font-size:16px}
.tip .bubble::after{left:-11px;top:24px;transform:rotate(-45deg)}
.tip .bubble b{color:var(--rust)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.twocol>div{background:var(--bg);border-radius:14px;padding:10px 12px;min-width:0}
.twocol h4{margin:0 0 4px;font:800 15px var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.twocol .big{font:800 21px var(--f-display);line-height:1.2}
.twocol small{display:block;color:var(--muted);font-weight:600;font-size:14px;margin-top:4px}
.mtx{border-collapse:separate;border-spacing:4px;margin:4px auto;font-variant-numeric:tabular-nums}
.mtx th{font-size:13px;color:var(--muted);font-weight:800;padding:2px 6px;text-transform:uppercase;letter-spacing:.04em}
.mtx td{background:var(--green-l);border-radius:10px;font:800 26px var(--f-display);color:var(--green-d);text-align:center;min-width:76px;padding:4px 8px}
.mtx td.q{background:var(--amber-l);color:var(--amber-d);outline:3px dashed var(--amber)}
.mtx caption{font:800 16px var(--f-display);color:var(--green-d);padding-bottom:2px}
.mtx-wrap{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;overflow-x:auto}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.qlabel{font-weight:900;color:var(--muted);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.spk{width:44px;height:44px;border-radius:12px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;flex:none}
.spk svg{width:24px;height:24px}
.prompt{font-size:25px;font-weight:700;margin-bottom:16px}
.prompt b{color:var(--blue-d)}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:19px;box-shadow:0 4px 0 var(--line);transition:transform .06s}
.opt:active{transform:translateY(2px)}
.opt.sel{border-color:var(--blue);background:var(--blue-l);box-shadow:0 4px 0 var(--blue)}
.opt.right{border-color:var(--ok);background:var(--ok-l);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--oops);background:var(--oops-l);box-shadow:0 4px 0 var(--oops)}
.opts.two{grid-template-columns:1fr 1fr}
.opts.two .opt{text-align:center}
.toks{display:flex;flex-wrap:wrap;gap:8px;font-size:22px;line-height:1.2}
.tok{padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800;box-shadow:0 3px 0 var(--line)}
.tok.sel{border-color:var(--green);background:var(--green-l);box-shadow:0 3px 0 var(--green)}
.tok.right{border-color:var(--ok);background:var(--ok-l)}
.tok.miss{border-color:var(--oops);border-style:dashed}
.tok.wrong{border-color:var(--oops);background:var(--oops-l)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;min-width:0}
.mt{padding:14px 10px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:19px;box-shadow:0 4px 0 var(--line);text-align:center}
.mt.sel{border-color:var(--amber);background:var(--amber-l);box-shadow:0 4px 0 var(--amber)}
.mt.done{border-color:var(--ok);background:var(--ok-l);color:var(--ok-d);box-shadow:none;opacity:.75}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:2px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bottom .inner{max-width:560px;margin:0 auto;display:grid;gap:12px}
.bottom.good{background:var(--ok-l);border-color:var(--ok)}
.bottom.bad{background:var(--oops-l);border-color:var(--oops)}
.fb{display:flex;gap:12px;align-items:center}
.fb h3{font-size:26px}
.good .fb h3{color:var(--ok-d)}
.bad .fb h3{color:var(--oops-d)}
.fb p{margin:2px 0 0;font-weight:700}
.fb .why{font-weight:600;font-size:15px;color:var(--ink)}
.slide{animation:slide .25s ease-out}
@keyframes slide{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
.xpfly{font:800 20px var(--f-display);color:var(--amber-d)}

/* ---------- fim de lição ---------- */
.end{display:grid;gap:16px;justify-items:center;text-align:center;padding-top:20px}
.end h1{font-size:36px;color:var(--ok-d)}
.bigstars{display:flex;gap:8px}
.bigstars svg{width:58px;height:58px}
.bigstars svg.on{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.bigstars svg:nth-child(2){animation-delay:.15s}
.bigstars svg:nth-child(3){animation-delay:.3s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{border-radius:16px;border:2px solid var(--line);background:var(--card);padding:10px 6px}
.stat b{display:block;font:800 26px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.end .btn{max-width:420px}

/* ---------- resumão ---------- */
.res{display:grid;gap:14px}
.res .card h3{font-size:22px;margin-bottom:8px}
.res ul{margin:0;padding-left:20px;display:grid;gap:6px}
.res li b{font-weight:900}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.bounce,.pop,.slide,.shake,.bigstars svg.on{animation:none}}
@media (max-width:380px){.prompt{font-size:22px}.ex-title{font-size:24px}.node:nth-child(4n+3){margin-left:24%}}
</style>

<div id="app"></div>
<canvas id="confetti"></canvas>

<script id="conteudo">
/* ===================== CONTEÚDO (conferido com o roteiro da escola) ===================== */
const PR = ['Sem hífen: só no fim', 'Com hífen: os dois mudam', 'Com hífen: só o 1º muda', 'Com hífen: só o 2º muda'];
const GT = ['Biforme', 'Comum de dois', 'Sobrecomum', 'Epiceno'];
const ART = { def: { ms: 'o', fs: 'a', mp: 'os', fp: 'as' }, indef: { ms: 'um', fs: 'uma', mp: 'uns', fp: 'umas' } };
// mc: a resposta certa é SEMPRE a primeira da lista (o jogo embaralha na tela)
const mc = (q, o, why, x = {}) => ({ t: 'mc', q, o, a: 0, why, ...x });
const tf = (q, v, why) => ({ t: 'mc', q: 'Verdadeiro ou falso? ' + q, o: ['Verdadeiro', 'Falso'], a: v ? 0 : 1, keep: true, two: true, why });
const regra = (q, a, why) => ({ t: 'mc', q, o: PR, a, keep: true, why });
const tipo = (q, a, why) => ({ t: 'mc', q, o: GT, a, keep: true, why });
const tap = (s, a, why) => ({ t: 'tap', q: 'Toque em TODOS os artigos da frase.', s: s.split(' '), a, why });
const match = (q, pairs, why) => ({ t: 'match', q, pairs, why });
const tabela = (kind, cell, o, why) => ({ t: 'table', kind, cell, q: 'Qual artigo está faltando na tabela?', o, a: 0, why });
const ex = (o) => ({ t: 'explain', ...o });

const MODULES = [
{
  id: 'plurais', n: 1, name: 'Plurais', desc: 'Palavras compostas', color: 'var(--blue)', light: 'var(--blue-l)',
  lessons: [
  { id: 'p1', title: 'Sem hífen: plural só no fim', steps: [
    ex({ title: 'Palavra grudada: plural só no fim',
      formula: '<span class="fx">[ PALAVRA ]</span><span class="op">+</span><span class="fx s">[ S ]</span><span class="op">=</span><span class="fx">PLURAL</span>',
      body: '<p>Quando duas palavras se juntaram e viraram <b>uma palavra só, sem hífen</b>, o plural é feito como numa palavra comum: mexemos <b>só no final</b>.</p>',
      list: [['girassol', 'girass<mark>óis</mark>', 'igual a sol → sóis'], ['pontapé', 'pontap<mark>és</mark>'], ['mandachuva', 'mandachuv<mark>as</mark>']],
      memo: 'Grudou? Virou <b>uma palavra só</b>. O plural vai <b>só no fim</b>.',
      say: 'Palavras sem hífen. Quando duas palavras se juntam e viram uma palavra só, sem hífen, o plural é feito como numa palavra comum: só no final. Girassol, girassóis. Pontapé, pontapés. Mandachuva, mandachuvas. Para lembrar: grudou? Virou uma palavra só. O plural vai só no fim.' }),
    mc('Qual é o plural de <b>pontapé</b>?', ['pontapés', 'pontaspés', 'ponta-pés', 'pontapéses'], 'Pontapé é uma palavra só, sem hífen. Só ganha o S no fim: pontapés.'),
    mc('Qual é o plural de <b>girassol</b>?', ['girassóis', 'girassols', 'girassoles', 'girasóis'], 'Girassol termina igual a sol. Sol vira sóis, então girassol vira girassóis.'),
    mc('Qual é o plural de <b>mandachuva</b>?', ['mandachuvas', 'mandaschuvas', 'mandaschuva', 'manda-chuvas'], 'Mandachuva é uma palavra só, sem hífen: o S vai só no fim.'),
    mc('Qual destas palavras compostas <b>NÃO</b> tem hífen?', ['girassol', 'couve-flor', 'guarda-chuva', 'beija-flor'], 'Girassol é escrita toda junta. As outras têm hífen (o tracinho).'),
    mc('Nas palavras compostas <b>sem hífen</b>, onde vai o plural?', ['Só no final da palavra', 'No meio da palavra', 'No começo e no final'], 'Sem hífen é uma palavra só, então o plural vai só no final.'),
    mc('Qual é o plural de <b>passatempo</b>?', ['passatempos', 'passastempos', 'passatempoes', 'passos-tempos'], 'Passatempo é uma palavra só: passatempos.'),
    mc('Qual é o plural de <b>rodapé</b>?', ['rodapés', 'rodaspés', 'rodapéis', 'rodas-pés'], 'Rodapé é uma palavra só, igual a pontapé: rodapés.'),
    tf('Girassol vira girassóis do mesmo jeito que sol vira sóis.', true, 'Isso mesmo! O fim da palavra é "sol", e sol no plural é sóis.'),
  ]},
  { id: 'p2', title: 'Com hífen: os DOIS mudam', steps: [
    ex({ title: 'Com hífen: os DOIS mudam',
      formula: '<span class="fx">[ PALAVRA 1 <span class="s">+ S</span> ]</span><span class="op">-</span><span class="fx">[ PALAVRA 2 <span class="s">+ S</span> ]</span>',
      body: '<p>Quando a palavra tem hífen e as duas partes são palavras que <b>dão nome</b> (substantivo), <b>dão característica</b> (adjetivo) ou são <b>número</b> (numeral), <b>as DUAS vão para o plural</b>.</p>',
      list: [['couve-flor', 'couve<mark>s</mark>-flor<mark>es</mark>', 'substantivo + substantivo'], ['segunda-feira', 'segunda<mark>s</mark>-feira<mark>s</mark>', 'numeral + substantivo'], ['amor-perfeito', 'amor<mark>es</mark>-perfeito<mark>s</mark>', 'substantivo + adjetivo']],
      memo: 'Nome com nome, nome com característica ou número com nome: <b>os dois ganham plural</b>.',
      say: 'Com hífen: os dois mudam. Quando as duas partes são substantivo, adjetivo ou numeral, as duas vão para o plural. Couve-flor, couves-flores. Segunda-feira, segundas-feiras. Amor-perfeito, amores-perfeitos. Para lembrar: nome com nome, nome com característica, ou número com nome: os dois ganham plural.' }),
    mc('Qual é o plural de <b>couve-flor</b>?', ['couves-flores', 'couve-flores', 'couves-flor', 'couve-flors'], 'Couve e flor são dois substantivos: os dois mudam. Couves-flores.'),
    mc('Qual é o plural de <b>segunda-feira</b>?', ['segundas-feiras', 'segunda-feiras', 'segundas-feira'], 'Segunda é numeral e feira é substantivo: os dois mudam.'),
    mc('Qual é o plural de <b>cachorro-quente</b>?', ['cachorros-quentes', 'cachorro-quentes', 'cachorros-quente'], 'Cachorro é substantivo e quente é adjetivo: os dois mudam.'),

/* ---------- som (sintetizado, sem arquivos) ---------- */
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(freq, start, dur, type = 'triangle', vol = 0.18) {
  const a = audio(); if (!a || !S.sound) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = freq;
  const t = a.currentTime + start; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
const SFX = {
  ok() { tone(784, 0, .16); tone(1175, .1, .28); },
  combo() { tone(784, 0, .12); tone(988, .08, .12); tone(1319, .16, .3); },
  oops() { tone(330, 0, .18, 'sine', .14); tone(262, .14, .28, 'sine', .12); },
  tap() { tone(600, 0, .05, 'sine', .06); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .35)); tone(1319, .5, .6); },
};

/* ---------- voz (do próprio navegador) ---------- */
let VOICE = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^pt[-_]BR/i.test(v.lang));
  const fav = ['Luciana', 'Francisca', 'Google português do Brasil', 'Thalita', 'Maria'];
  VOICE = vs.find(v => fav.some(f => v.name.includes(f))) || vs[0] || speechSynthesis.getVoices().find(v => /^pt/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, force) {
  if (!('speechSynthesis' in window) || (!S.voice && !force)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'pt-BR'; if (VOICE) u.voice = VOICE; u.rate = 0.97; u.pitch = 1.08; speechSynthesis.speak(u); } catch (e) {}
}
function hush() { try { speechSynthesis.cancel(); } catch (e) {} }

/* ---------- confete ---------- */
const cv = document.getElementById('confetti'), cx = cv.getContext('2d');
let parts = [], raf = 0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n = 90) {
  if (reduce) return;
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  const cols = ['#2D5BD0', '#14755B', '#E7A21B', '#E8723C', '#2FA968', '#F5B800'];
  for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .55, vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 6, r: Math.random() * 6 + 4, c: pick(cols), a: Math.random() * 6, va: (Math.random() - .5) * .4, life: 0 });
  if (!raf) raf = requestAnimationFrame(step);
}
function step() {
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); cx.clearRect(0, 0, innerWidth, innerHeight);
  parts.forEach(p => { p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life++; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 3, p.r, p.r * .66); cx.restore(); });
  parts = parts.filter(p => p.y < innerHeight + 40 && p.life < 200);
  raf = parts.length ? requestAnimationFrame(step) : (cx.clearRect(0, 0, innerWidth, innerHeight), 0);
}

/* ---------- lição ---------- */
let R = null;
function startLesson(lesson) {
  let steps = lesson.steps.slice();
  if (lesson.shuffle) { const head = steps.filter(s => s.t === 'explain'); steps = head.concat(shuffle(steps.filter(s => s.t !== 'explain'))); }
  R = { lesson, queue: steps, pos: 0, firstWrong: new Set(), right: 0, xp: 0, combo: 0, mode: 'lesson' };
  renderStep();
}
function startReview() {
  const qs = shuffle(Object.keys(S.wrong).map(id => QBYID[id]).filter(Boolean)).slice(0, 15);
  R = { lesson: { id: 'review', title: 'Revisar erros', mod: { color: 'var(--oops)' } }, queue: [ex({ title: 'Hora de revisar!', body: '<p>Aqui estão as perguntas que você errou antes. Cada uma que você acertar agora sai da lista.</p>', memo: 'Quem revisa os erros <b>memoriza de verdade</b>. Bora!', say: 'Hora de revisar! Aqui estão as perguntas que você errou antes. Cada uma que você acertar agora sai da lista.' })].concat(qs), pos: 0, firstWrong: new Set(), right: 0, xp: 0, combo: 0, mode: 'review' };
  renderStep();
}
function modClass(l) { return 'm-' + ((l.mod && l.mod.id) || 'final'); }

function shell(inner, bottom) {
  const done = R.pos, total = R.queue.length;
  $app.innerHTML = `<div class="lesson ${modClass(R.lesson)}">
    <div class="lbar"><button class="x" id="quit" aria-label="Sair da lição">${ICON.x}</button><div class="prog" role="progressbar" aria-valuenow="${done}" aria-valuemax="${total}"><i style="width:${Math.max(4, done / total * 100)}%"></i></div><div class="combo">${R.combo >= 2 ? '<span style="display:inline-flex;align-items:center;gap:2px">' + ICON.fire.replace('<svg', '<svg width="18" height="18"') + R.combo + '</span>' : ''}</div></div>
    ${inner}</div>
    <div class="bottom" id="bottom"><div class="inner">${bottom}</div></div>`;
  document.getElementById('quit').onclick = () => { hush(); renderMap(); };
  window.scrollTo(0, 0);
}

function renderStep() {
  const s = R.queue[R.pos];
  if (!s) return renderEnd();
  if (s.t === 'explain') return renderExplain(s);
  renderQuestion(s);
}

function renderExplain(s) {
  const l = R.lesson, color = (l.mod && l.mod.color) || 'var(--blue)';
  let body = s.body || '';
  if (body === '__MATRIZ__') body = `<div class="mtx-wrap">${matrix('def')}${matrix('indef')}</div>`;
  const list = s.list ? `<ul class="ex-list">${s.list.map(r => r[1] === '' && !r[2] ? `<li style="background:none;padding:6px 0 0;font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">${r[0]}</li>` : `<li><span>${r[0]}</span>${r[1] ? `<span class="arrow">→</span><span>${r[1]}</span>` : ''}${r[2] ? `<small>${r[2]}</small>` : ''}</li>`).join('')}</ul>` : '';
  shell(`<article class="card slide">
      <span class="kicker" style="background:${color}">${l.mod && l.mod.name ? l.mod.name + ' · ' : ''}Aprenda</span>
      <h2 class="ex-title">${s.title}</h2>
      ${s.formula ? `<div class="formula">${s.formula}</div>` : ''}
      <div class="ex-body">${body}</div>${list}
      ${s.memo ? `<div class="tip">${tico('happy', 64)}<div class="bubble"><b>Dica do Tico:</b> ${s.memo}</div></div>` : ''}
    </article>
    <button class="btn ghost small" id="again" style="max-width:260px;margin:0 auto">Ouvir de novo</button>`,
    `<button class="btn" id="next">Entendi! Vamos lá</button>`);
  document.getElementById('again').onclick = () => say(s.say || strip(s.title + '. ' + body), true);
  document.getElementById('next').onclick = () => { SFX.tap(); R.pos++; renderStep(); };
  setTimeout(() => say(s.say || strip(s.title + '. ' + body)), 250);
}

function matrix(kind, hide) {
  const t = ART[kind];
  const cell = c => c === hide ? '<td class="q">?</td>' : `<td>${t[c]}</td>`;
  return `<table class="mtx"><caption>${kind === 'def' ? 'Definidos (específicos)' : 'Indefinidos (qualquer um)'}</caption>
    <tr><th></th><th>Masc.</th><th>Fem.</th></tr>
    <tr><th>Sing.</th>${cell('ms')}${cell('fs')}</tr>
    <tr><th>Plural</th>${cell('mp')}${cell('fp')}</tr></table>`;
}

function renderQuestion(s) {
  const l = s.lesson, label = R.mode === 'review' ? 'Revisão' : (l.mod && l.mod.name) || 'Simulado';
  let area = '', sel = null;
  if (s.t === 'mc' || s.t === 'table') {
    const opts = s.o.map((t, i) => ({ t, ok: i === s.a }));
    R.opts = s.keep ? opts : shuffle(opts);
    const two = s.two || (R.opts.length === 2 && R.opts.every(o => o.t.length < 22));
    area = (s.t === 'table' ? `<div class="mtx-wrap" style="margin-bottom:14px">${matrix(s.kind, s.cell)}</div>` : '') +
      `<div class="opts ${two ? 'two' : ''}">${R.opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>`;
  } else if (s.t === 'tap') {
    area = `<div class="toks">${s.s.map((w, i) => `<button class="tok" data-i="${i}">${esc(w)}</button>`).join('')}</div>`;
  } else if (s.t === 'match') {
    const L = shuffle(s.pairs.map((p, i) => ({ t: p[0], i }))), Rr = shuffle(s.pairs.map((p, i) => ({ t: p[1], i })));
    area = `<div class="match"><div class="col">${L.map(o => `<button class="mt" data-side="L" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div><div class="col">${Rr.map(o => `<button class="mt" data-side="R" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div></div>`;
  }
  shell(`<article class="card slide">
      <div class="qhead"><span class="qlabel">${label}</span><button class="spk" id="spk" aria-label="Ouvir a pergunta">${ICON.spk}</button></div>
      <h2 class="prompt">${s.q}</h2>${area}</article>`,
    s.t === 'match' ? `<div style="text-align:center;font-weight:800;color:var(--muted)">Toque em uma palavra de cada lado</div>` : `<button class="btn" id="check" disabled>Verificar</button>`);
  document.getElementById('spk').onclick = () => say(strip(s.q), true);
  setTimeout(() => say(strip(s.q)), 200);
  const check = document.getElementById('check');

  if (s.t === 'mc' || s.t === 'table') {
    $app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      SFX.tap(); $app.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = +b.dataset.i; check.disabled = false;
    });
    check.onclick = () => {
      const ok = R.opts[sel].ok;
      $app.querySelectorAll('.opt').forEach((b, i) => { b.disabled = true; if (R.opts[i].ok) b.classList.add('right'); else if (i === sel) b.classList.add('wrong'); });
      feedback(s, ok, ok ? '' : R.opts.find(o => o.ok).t);
    };
  } else if (s.t === 'tap') {
    const chosen = new Set();
    $app.querySelectorAll('.tok').forEach(b => b.onclick = () => {
      SFX.tap(); const i = +b.dataset.i; chosen.has(i) ? chosen.delete(i) : chosen.add(i); b.classList.toggle('sel'); check.disabled = chosen.size === 0;
    });
    check.onclick = () => {
      const want = new Set(s.a), ok = want.size === chosen.size && [...want].every(i => chosen.has(i));
      $app.querySelectorAll('.tok').forEach(b => { const i = +b.dataset.i; b.disabled = true; b.classList.remove('sel'); if (want.has(i) && chosen.has(i)) b.classList.add('right'); else if (want.has(i)) b.classList.add('miss'); else if (chosen.has(i)) b.classList.add('wrong'); });
      feedback(s, ok, ok ? '' : s.a.map(i => s.s[i].replace(/[.,!?]/g, '')).join(', '));
    };
  } else if (s.t === 'match') {
    let pickL = null, pickR = null, matched = 0, misses = 0;
    const tryPair = () => {
      if (!pickL || !pickR) return;
      if (pickL.dataset.i === pickR.dataset.i) {
        [pickL, pickR].forEach(b => { b.classList.remove('sel'); b.classList.add('done'); b.disabled = true; }); matched++; tone(880, 0, .12); tone(1175, .07, .16);
        if (matched === s.pairs.length) setTimeout(() => feedback(s, true, '', misses), 250);
      } else {
        misses++; SFX.oops(); const a = pickL, b = pickR; [a, b].forEach(x => x.classList.add('shake')); setTimeout(() => [a, b].forEach(x => x.classList.remove('shake', 'sel')), 380);
      }
      pickL = pickR = null;
    };
    $app.querySelectorAll('.mt').forEach(b => b.onclick = () => {
      if (b.classList.contains('done')) return; SFX.tap();
      if (b.dataset.side === 'L') { if (pickL) pickL.classList.remove('sel'); pickL = b; } else { if (pickR) pickR.classList.remove('sel'); pickR = b; }
      b.classList.add('sel'); tryPair();
    });
  }
}

function feedback(s, ok, answer, misses = 0) {
  const retry = R.firstWrong.has(s.id);
  let xp = 0, extra = '';
  if (ok) {
    R.right++; R.combo++; S.bestCombo = Math.max(S.bestCombo, R.combo);
    xp = retry ? 5 : (misses ? 6 : 10);
    if (R.combo > 0 && R.combo % 5 === 0) { xp += 5; }
    if (COMBO_MSG[R.combo]) extra = COMBO_MSG[R.combo];
    if (R.mode === 'review') delete S.wrong[s.id];
    R.xp += xp; S.xp += xp; save();
    (COMBO_MSG[R.combo] ? SFX.combo : SFX.ok)(); confetti(COMBO_MSG[R.combo] ? 120 : 45);
  } else {
    R.combo = 0; R.firstWrong.add(s.id); S.wrong[s.id] = (S.wrong[s.id] || 0) + 1; save();
    R.queue.push(s); SFX.oops();
  }
  const title = ok ? pick(PRAISE)() : pick(OOPS)();
  const b = document.getElementById('bottom');
  b.className = 'bottom slide ' + (ok ? 'good' : 'bad');
  b.innerHTML = `<div class="inner"><div class="fb">${tico(ok ? 'cheer' : 'oops', 70, ok ? 'pop' : '')}<div style="min-width:0">
      <h3>${title}</h3>
      ${ok ? `<p><span class="xpfly">+${xp} pontos</span>${extra ? ` · <b style="color:var(--oops-d)">${extra}</b>` : ''}</p>` : `<p>Resposta certa: <b>${esc(answer)}</b></p>`}
      <p class="why">${s.why || ''}${ok ? '' : '<br><b>' + pick(OOPS_SUB) + '</b>'}</p></div></div>
    <button class="btn ${ok ? 'ok' : 'oops'}" id="cont">${ok ? 'Continuar' : 'Entendi'}</button></div>`;
  const c = document.getElementById('cont'); c.focus({ preventScroll: true });
  c.onclick = () => { SFX.tap(); R.pos++; renderStep(); };
  say(ok ? strip(title) + (extra ? '. ' + extra : '') : strip(title) + ' A resposta certa é: ' + answer + '. ' + strip(s.why || ''));
}

function renderEnd() {
  hush();
  const total = new Set(R.queue.filter(s => s.t !== 'explain').map(s => s.id)).size; // perguntas únicas
  const errs = R.firstWrong.size;
  const stars = errs === 0 ? 3 : errs <= 2 ? 2 : 1;
  const acc = total ? Math.round((total - errs) / total * 100) : 100;
  if (R.mode === 'lesson') { const prev = S.done[R.lesson.id]; S.done[R.lesson.id] = { stars: Math.max(stars, prev ? prev.stars : 0) }; }
  save();
  const msg = R.mode === 'review' ? (wrongCount() ? `Ainda faltam ${wrongCount()} para revisar. Você está quase lá!` : 'Lista de erros zerada! Você aprendeu tudo.')
    : stars === 3 ? `Sem errar nenhuma! ${N()}, você é demais!` : stars === 2 ? 'Muito bom! Quase perfeito. Mais uma rodada e vira 3 estrelas.' : 'Você terminou! Cada erro virou aprendizado. Que tal repetir para ganhar mais estrelas?';
  const idx = ALL.indexOf(R.lesson), next = R.mode === 'lesson' && idx >= 0 ? (ALL[idx + 1] || FINAL) : null;
  $app.innerHTML = `<div class="end">
    ${tico('cheer', 130, 'bounce')}
    <h1>${R.mode === 'review' ? 'Revisão feita!' : R.lesson === FINAL ? 'Simulado completo!' : 'Lição completa!'}</h1>
    ${R.mode === 'lesson' ? `<div class="bigstars">${STAR(stars >= 1)}${STAR(stars >= 2)}${STAR(stars >= 3)}</div>` : ''}
    <div class="bubble" style="max-width:420px">${msg}</div>
    <div class="stats"><div class="stat"><b>+${R.xp}</b><span>pontos</span></div><div class="stat"><b>${acc}%</b><span>de primeira</span></div><div class="stat"><b>${S.bestCombo}</b><span>recorde seguidas</span></div></div>
    ${next && R.lesson !== FINAL ? `<button class="btn ok" id="nx">Próxima: ${next.title}</button>` : ''}
    ${R.mode === 'lesson' && stars < 3 ? `<button class="btn ghost" id="rep">Repetir esta lição</button>` : ''}
    <button class="btn ghost" id="map">Voltar ao mapa</button>
  </div>`;
  SFX.win(); confetti(160); setTimeout(() => confetti(120), 500);
  say((R.lesson === FINAL ? 'Simulado completo! ' : 'Lição completa! ') + strip(msg));
  const nx = document.getElementById('nx'); if (nx) nx.onclick = () => startLesson(next);
  const rp = document.getElementById('rep'); if (rp) rp.onclick = () => startLesson(R.lesson);
  document.getElementById('map').onclick = renderMap;
}

/* ---------- resumão ---------- */
function renderResumo() {
  window.scrollTo(0, 0);
  $app.innerHTML = `<div class="lesson res">
    <div class="lbar"><button class="x" id="back" aria-label="Voltar">${ICON.x}</button><h2 style="font-size:24px">Resumão das regras</h2></div>
    <div class="card m-plurais"><span class="kicker" style="background:var(--blue)">1 · Plurais</span><h3>Palavras compostas</h3><ul>
      <li><b>Sem hífen:</b> plural só no fim. girassol → girass<mark>óis</mark></li>
      <li><b>Com hífen, nome + nome / característica / número:</b> os dois mudam. couve<mark>s</mark>-flor<mark>es</mark>, segunda<mark>s</mark>-feira<mark>s</mark></li>
      <li><b>Com DE/DO/DA ou função:</b> só o 1º muda. pombo<mark>s</mark>-correio, dragõ<mark>es</mark>-do-mar</li>
      <li><b>Com verbo ou repetição:</b> só o 2º muda. guarda-chuv<mark>as</mark>, tico-tico<mark>s</mark></li></ul></div>
    <div class="card m-artigos"><span class="kicker" style="background:var(--green)">2 · Artigos</span><h3>Definidos e indefinidos</h3><ul>
      <li><b>Definidos (específico):</b> o, a, os, as</li><li><b>Indefinidos (qualquer um):</b> um, uma, uns, umas</li>
      <li>Classifique com <b>3 perguntas</b>: definido ou indefinido? masculino ou feminino? singular ou plural?</li></ul>
      <div class="mtx-wrap" style="margin-top:10px">${matrix('def')}${matrix('indef')}</div></div>
    <div class="card m-genero"><span class="kicker" style="background:var(--amber)">3 · Gênero</span><h3>Biformes e uniformes</h3><ul>
      <li><b>Biforme (duas formas):</b> -o/-e → -a (gato/gat<mark>a</mark>), -ão → -ã/-oa (irm<mark>ã</mark>, le<mark>oa</mark>), -esa/-essa/-isa (princ<mark>esa</mark>, cond<mark>essa</mark>, poet<mark>isa</mark>)</li>
      <li><b>Radical diferente:</b> a palavra muda toda. rei/rainha, cavalo/égua, boi/vaca, homem/mulher, pai/mãe</li>
      <li><b>Comum de dois:</b> só o artigo muda. o/a artista, o/a estudante</li>
      <li><b>Sobrecomum:</b> nada muda, nem o artigo. a criança, o indivíduo, a pessoa</li>
      <li><b>Epiceno:</b> animais e plantas + macho/fêmea. o jacaré macho, a onça fêmea</li></ul></div>
    <button class="btn" id="back2">Voltar ao mapa</button></div>`;
  document.getElementById('back').onclick = renderMap; document.getElementById('back2').onclick = renderMap;
  say('Resumão das regras. Plurais, artigos e gênero, tudo numa página só.');
}

/* ---------- início ---------- */
const boot = () => (S.started ? renderMap() : renderStart());
boot();
</script>
